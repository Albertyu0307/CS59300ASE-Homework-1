<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper · AI Research Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- LLM output is Markdown with LaTeX math: marked converts it to HTML (KaTeX renders the math),
       DOMPurify sanitizes that HTML -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.18.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.13/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="index.html" class="brand"><strong>AI Research Assistant</strong></a></li></ul>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html">Search</a></li>
        <li><a href="library.html">Library</a></li>
      </ul>
    </nav>
  </header>

  <!-- Opened as paper.html?id=N -->
  <main class="container">
    <p id="status" class="status" role="status" hidden></p>
    <section id="paper"></section>

    <!-- Shown once the paper has loaded -->
    <div id="assistant" hidden>
      <!-- What the LLM gets to see: e.g. "abstract only" or "only the first part of a very long paper" -->
      <p id="context-note" class="context-note" hidden></p>

      <section>
        <div class="section-heading">
          <h2>Summary</h2>
          <button id="summary-button" type="button">Summarize</button>
        </div>
        <p id="summary-status" class="status" role="status" hidden></p>
        <div id="summary" class="markdown"></div>
      </section>

      <section>
        <h2>Ask about this paper</h2>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <div id="quick-questions" class="quick-questions"></div>
        <p id="chat-status" class="status" role="status" hidden></p>
        <form id="ask-form" class="ask-form">
          <textarea id="question" name="question" rows="2" maxlength="2000" required
                    placeholder="Ask a question about this paper (Enter to send, Shift+Enter for a new line)"></textarea>
          <button type="submit">Ask</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="js/paper.js"></script>
</body>
</html>
