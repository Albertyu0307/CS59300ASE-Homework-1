<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · AI Research Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="index.html" class="brand"><strong>AI Research Assistant</strong></a></li></ul>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html" aria-current="page">Search</a></li>
        <li><a href="library.html">Library</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Search papers</h1>
    <!-- Submits as index.html?q=...&source=..., so results survive a refresh and the back button works. -->
    <form id="search-form" role="search" action="index.html" method="get">
      <input type="search" name="q" id="search-input" placeholder="e.g. graph neural networks"
             aria-label="Search papers" required maxlength="300">
      <select name="source" id="search-source" aria-label="Search source" aria-describedby="source-hint">
        <option value="auto">arXiv</option>
        <option value="openalex">OpenAlex</option>
      </select>
      <button type="submit">Search</button>
    </form>
    <p id="source-hint" class="source-hint">
      arXiv switches to OpenAlex automatically when it's unavailable. OpenAlex also covers journals,
      but not every result has a PDF.
    </p>
    <p id="status" class="status" role="status" hidden></p>
    <section id="results"></section>
  </main>

  <footer class="container">
    <small id="health">Backend: checking...</small>
  </footer>

  <script type="module" src="js/search.js"></script>
</body>
</html>
