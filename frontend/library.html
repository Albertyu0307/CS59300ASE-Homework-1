<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · AI Research Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="index.html" class="brand"><strong>AI Research Assistant</strong></a></li></ul>
      <ul>
        <li><a href="index.html">Search</a></li>
        <li><a href="library.html" aria-current="page">Library</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>My library</h1>
    <!-- Uploads as soon as a file is chosen (js/library.js) -->
    <form id="upload-form">
      <label for="upload-input">Add a paper from a PDF</label>
      <input type="file" id="upload-input" name="file" accept=".pdf,application/pdf" aria-describedby="upload-hint">
      <small id="upload-hint">
        Up to 25 MB. The text, title, authors, year and abstract are extracted automatically.
        Scanned PDFs (images of pages) aren't supported.
      </small>
    </form>
    <p id="upload-status" class="status" role="status" hidden></p>

    <p id="status" class="status" role="status" hidden></p>
    <section id="papers"></section>
  </main>

  <script type="module" src="js/library.js"></script>
</body>
</html>
