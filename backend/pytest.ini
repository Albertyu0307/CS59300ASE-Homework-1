[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    # Starlette's TestClient nags about a future httpx replacement; not something this project controls.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
markers =
    e2e: browser tests of the frontend (Playwright). Skip them with: -m "not e2e"
